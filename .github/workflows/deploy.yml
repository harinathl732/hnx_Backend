name: Deploy Backend to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Navigate to backend directory
            cd ~/hnx_Backend
            
            # Fetch latest code from GitHub
            git pull origin main
            
            # Activate virtual environment if present
            if [ -d "venv" ]; then
              source venv/bin/activate
            fi
            
            # Install python requirements
            pip install -r requirements.txt
            
            # Force-kill any old process holding port 8000 to prevent port conflict
            sudo fuser -k 8000/tcp || kill -9 $(lsof -t -i:8000) || kill -9 $(netstat -nlp | grep :8000 | awk '{print $7}' | cut -d'/' -f1) || true
            
            # If backend is not running, start it in the background as a fallback
            if ! pgrep -f "uvicorn app.main:app" > /dev/null; then
              nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
            fi
